name: Kurse abrufen

on:
  schedule:
    # Hauptzeitplan läuft über Supabase pg_cron (Migration 0003), weil GitHub viele geplante Läufe auslässt.
    # Diese Zeiten sind nur Reserve – bewusst nicht zur vollen/halben Stunde (dann ist GitHub am vollsten).
    - cron: "17 6-21 * * 1-5"     # stündlich, Mo–Fr, ca. 7–23 Uhr deutscher Zeit (UTC)
    - cron: "43 2 * * *"          # nachts: Tageskurse, Fundamentaldaten, Aufräumen
  workflow_dispatch:               # manuell oder von Supabase bei neuem Ticker (Modus new, Migration 0002)
    inputs:
      mode:
        description: "Modus"
        type: choice
        options: [quotes, nightly, new, test-push]
        default: quotes
      symbols:
        description: "Symbole für Modus new (Leerzeichen-getrennt; leer = alle noch nicht geladenen)"
        required: false
        default: ""

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Modus bestimmen
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: |
          case "$EVENT" in
            schedule)
              if [ "$SCHEDULE" = "43 2 * * *" ]; then echo "args=nightly" >> "$GITHUB_OUTPUT"; else echo "args=quotes" >> "$GITHUB_OUTPUT"; fi ;;
            workflow_dispatch)
              SYMS=$(printf '%s' "$INPUT_SYMBOLS" | tr -cd 'A-Za-z0-9.^=_ -')
              echo "args=$INPUT_MODE $SYMS" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python -m pipeline.run ${{ steps.mode.outputs.args }}
